name: Publish to NuGet
on:
  release:
    types: [published]

jobs:
  build-and-test:
    name: Build, test and pack
    uses: markwhitaker/shared-workflows/.github/workflows/dotnet-publish-release-to-nuget.yml@main

  publish-to-nuget:
    name: Publish release to NuGet
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Load packed artifact
        uses: actions/download-artifact@v4
        with:
          name: nugetPackage
          path: nugetPackage
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{secrets.NUGET_USERNAME}}
      - name: Publish package to NuGet.org
        run: dotnet nuget push nugetPackage/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
